<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1016">
<title>만능 단위 변환기 — 길이·무게·평수·온도·속도·데이터</title>
<meta name="description" content="값 하나를 넣으면 길이·무게·부피·넓이(평)·온도·속도·데이터 단위를 한 번에 환산합니다. 1평=3.305785㎡, 1근=600g, 화씨·섭씨까지.">
<style>
  [hidden]{display:none !important}
  :root{
    --bg:#0b1016; --bg2:#080d12; --card:#121a23; --card2:#0f161e;
    --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.16);
    --txt:#e7eef6; --dim:#8b9aa9; --dim2:#64748b;
    --a:#7dd3fc; --a2:#38bdf8; --a-ink:#04141d;
    --warn:#fbbf24; --bad:#fb7185;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;color:var(--txt);line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 460px at 6% -8%,rgba(125,211,252,.16),transparent 62%),
      radial-gradient(760px 420px at 100% 4%,rgba(56,189,248,.10),transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
  a.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--dim);
    font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;background:rgba(255,255,255,.03);margin-bottom:18px}
  a.back:hover{color:var(--txt);border-color:var(--line2)}
  header h1{font-size:clamp(23px,5.4vw,31px);letter-spacing:-.8px;margin:0 0 6px}
  header p{margin:0 0 20px;color:var(--dim);font-size:13.5px}
  .panel{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
    border-radius:var(--r);padding:16px;margin-bottom:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .tab{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);
    font:inherit;font-size:12.5px;font-weight:800;letter-spacing:-.2px;padding:8px 11px;border-radius:10px;
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,border-color .15s}
  .tab:hover{color:var(--txt);border-color:var(--line2);background:rgba(255,255,255,.06)}
  .tab[aria-selected="true"]{background:rgba(125,211,252,.16);border-color:rgba(125,211,252,.5);color:#dff4ff}
  .tab .ic{font-size:13px}

  .field-label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim2);margin:0 0 7px}
  .inrow{display:grid;grid-template-columns:minmax(0,1fr) 132px 46px;gap:8px;align-items:stretch}
  @media(max-width:430px){.inrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}}
  #value{width:100%;min-width:0;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--txt);font-size:18px;font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:-.2px}
  #value:focus{outline:none;border-color:rgba(125,211,252,.6);box-shadow:0 0 0 3px rgba(125,211,252,.14)}
  select{appearance:none;-webkit-appearance:none;width:100%;min-width:0;padding:12px 30px 12px 12px;
    border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);
    font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select:focus{outline:none;border-color:rgba(125,211,252,.6)}
  #swapBtn{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);color:var(--dim);
    font-size:16px;cursor:pointer;transition:transform .15s,color .15s,border-color .15s}
  #swapBtn:hover{color:var(--a);border-color:var(--line2);transform:rotate(180deg)}

  .hero{margin-top:14px;border-radius:14px;padding:15px;border:1px solid rgba(125,211,252,.28);
    background:linear-gradient(135deg,rgba(125,211,252,.14),rgba(56,189,248,.05));position:relative}
  .hero-k{display:block;font-size:12px;color:#a9d8ef;font-weight:700;margin-bottom:3px}
  .hero-v{display:block;font-size:clamp(22px,6vw,30px);font-weight:800;letter-spacing:-.9px;
    font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.25}
  .hero-v small{font-size:14px;font-weight:700;color:var(--dim);letter-spacing:0;margin-left:4px}
  .hero-act{display:flex;gap:8px;margin-top:12px}
  .btn{appearance:none;font:inherit;font-size:12.5px;font-weight:800;letter-spacing:-.2px;cursor:pointer;
    border-radius:10px;padding:9px 13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);
    transition:background .15s,border-color .15s,transform .12s}
  .btn:hover{background:rgba(255,255,255,.09);border-color:var(--line2)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--a);border-color:transparent;color:var(--a-ink)}
  .btn.primary:hover{background:#a5e3ff}
  .btn.ghost{background:transparent;color:var(--dim)}
  .btn.ghost:hover{color:var(--txt)}

  .err{margin:10px 0 0;font-size:12.5px;color:var(--bad);font-weight:700}
  .list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
  .list-head h2{margin:0;font-size:13.5px;letter-spacing:-.2px}
  .prec{display:inline-flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--line);
    border-radius:10px;background:rgba(255,255,255,.03)}
  .prec-t{font-size:10.5px;font-weight:800;color:var(--dim2);letter-spacing:.06em;padding:0 5px}
  .prec button{appearance:none;border:0;background:transparent;color:var(--dim);font:inherit;font-size:12px;
    font-weight:800;padding:5px 8px;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums}
  .prec button:hover{background:rgba(255,255,255,.07);color:var(--txt)}
  .prec button[aria-pressed="true"]{background:rgba(125,211,252,.18);color:#dff4ff}

  ul.units{list-style:none;margin:0;padding:0;display:grid;gap:2px}
  ul.units li{margin:0}
  .urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;
    text-align:left;appearance:none;font:inherit;color:inherit;background:transparent;border:0;
    border-radius:10px;padding:8px 10px;cursor:pointer;transition:background .14s}
  .urow:hover{background:rgba(255,255,255,.05)}
  .urow:focus-visible{outline:2px solid rgba(125,211,252,.7);outline-offset:-1px}
  .urow .un{font-size:13px;color:var(--dim);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .urow .un i{font-style:normal;color:var(--dim2);font-size:11.5px;margin-left:4px}
  .urow .uv{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;
    overflow-wrap:anywhere;text-align:right}
  .urow.on{background:rgba(125,211,252,.12);box-shadow:inset 0 0 0 1px rgba(125,211,252,.3)}
  .urow.on .un,.urow.on .uv{color:#dff4ff}
  .urow .uv u{text-decoration:none;font-size:11.5px;color:var(--dim);font-weight:700;margin-left:3px}

  h2.sec{font-size:14.5px;letter-spacing:-.3px;margin:22px 0 10px}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  .preset{appearance:none;font:inherit;cursor:pointer;text-align:left;border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));color:var(--txt);
    border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:700;transition:border-color .15s,transform .12s}
  .preset:hover{border-color:rgba(125,211,252,.45);transform:translateY(-1px)}
  .preset b{color:var(--a);font-weight:800}
  .preset span{display:block;font-size:11px;color:var(--dim2);font-weight:600}

  .note{margin-top:18px;font-size:12px;color:var(--dim2);line-height:1.75}
  .note b{color:var(--dim)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
    background:#e7eef6;color:#0b1016;font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:999px;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.8);transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../"><span aria-hidden="true">←</span> 오늘의 앱 3종</a>
  <header>
    <h1>만능 단위 변환기</h1>
    <p>값 하나를 넣으면 그 분류의 모든 단위로 한 번에 환산합니다. 평수·근·화씨까지.</p>
  </header>

  <section class="panel" aria-label="단위 변환">
    <div class="tabs" id="tabs" role="tablist" aria-label="단위 분류"></div>

    <label class="field-label" for="value">변환할 값</label>
    <div class="inrow">
      <input id="value" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
             value="1" aria-label="변환할 값">
      <select id="fromUnit" aria-label="원래 단위"></select>
      <button id="swapBtn" type="button" aria-label="원래 단위와 결과 단위 바꾸기" title="단위 바꾸기">⇄</button>
    </div>

    <div class="hero">
      <span class="hero-k" id="heroFrom">1 미터 =</span>
      <strong class="hero-v" id="heroVal">100 센티미터</strong>
      <div class="hero-act">
        <button class="btn primary" id="copyBtn" type="button">결과 복사</button>
        <button class="btn ghost" id="resetBtn" type="button">초기화</button>
      </div>
    </div>

    <p class="err" id="errMsg" role="alert" hidden></p>

    <div class="list-head">
      <h2>모든 단위로 보기</h2>
      <div class="prec" id="precBox" role="group" aria-label="소수 자릿수">
        <span class="prec-t">자릿수</span>
      </div>
    </div>
    <ul class="units" id="unitList"></ul>
  </section>

  <h2 class="sec">자주 쓰는 변환</h2>
  <div class="presets" id="presets"></div>

  <p class="note">
    <b>기준</b> — 1평 = 3.305785㎡(정확히 400/121㎡) · 1근 = 600g · 1돈 = 3.75g · 1컵 = 200mL ·
    1인치 = 2.54cm · 데이터는 1KB = 1,024B 기준입니다.<br>
    모든 계산은 이 브라우저 안에서만 이루어지고, 마지막으로 쓰던 분류·값은 이 기기에만 저장됩니다.
  </p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------- 데이터 */
  // 각 단위의 f 는 기준 단위(첫 번째)로 환산하는 계수. 온도는 별도 처리.
  var CATS = [
    { id: 'len', label: '길이', icon: '📏', special: null, units: [
      { id: 'm',  name: '미터',      sym: 'm',   f: 1 },
      { id: 'cm', name: '센티미터',  sym: 'cm',  f: 0.01 },
      { id: 'mm', name: '밀리미터',  sym: 'mm',  f: 0.001 },
      { id: 'km', name: '킬로미터',  sym: 'km',  f: 1000 },
      { id: 'in', name: '인치',      sym: 'in',  f: 0.0254 },
      { id: 'ft', name: '피트',      sym: 'ft',  f: 0.3048 },
      { id: 'yd', name: '야드',      sym: 'yd',  f: 0.9144 },
      { id: 'mi', name: '마일',      sym: 'mi',  f: 1609.344 },
      { id: 'nmi', name: '해리',     sym: 'nmi', f: 1852 }
    ]},
    { id: 'weight', label: '무게', icon: '⚖️', special: null, units: [
      { id: 'kg', name: '킬로그램', sym: 'kg', f: 1 },
      { id: 'g',  name: '그램',     sym: 'g',  f: 0.001 },
      { id: 'mg', name: '밀리그램', sym: 'mg', f: 0.000001 },
      { id: 't',  name: '톤',       sym: 't',  f: 1000 },
      { id: 'lb', name: '파운드',   sym: 'lb', f: 0.45359237 },
      { id: 'oz', name: '온스',     sym: 'oz', f: 0.028349523125 },
      { id: 'geun', name: '근',     sym: '근', f: 0.6 },
      { id: 'don',  name: '돈',     sym: '돈', f: 0.00375 }
    ]},
    { id: 'area', label: '넓이·평', icon: '🏠', special: null, units: [
      { id: 'm2',  name: '제곱미터',  sym: '㎡',  f: 1 },
      { id: 'pyeong', name: '평',     sym: '평',  f: 3.3057851239669422 },
      { id: 'cm2', name: '제곱센티미터', sym: '㎠', f: 0.0001 },
      { id: 'km2', name: '제곱킬로미터', sym: '㎢', f: 1000000 },
      { id: 'ft2', name: '제곱피트',  sym: 'ft²', f: 0.09290304 },
      { id: 'yd2', name: '제곱야드',  sym: 'yd²', f: 0.83612736 },
      { id: 'are', name: '아르',      sym: 'a',   f: 100 },
      { id: 'ha',  name: '헥타르',    sym: 'ha',  f: 10000 },
      { id: 'acre', name: '에이커',   sym: 'ac',  f: 4046.8564224 }
    ]},
    { id: 'volume', label: '부피', icon: '🧪', special: null, units: [
      { id: 'l',  name: '리터',    sym: 'L',   f: 1 },
      { id: 'ml', name: '밀리리터', sym: 'mL',  f: 0.001 },
      { id: 'm3', name: '세제곱미터', sym: 'm³', f: 1000 },
      { id: 'cup', name: '컵',     sym: '컵',  f: 0.2 },
      { id: 'gal', name: '갤런(미국)', sym: 'gal', f: 3.785411784 },
      { id: 'floz', name: '액량온스(미국)', sym: 'fl oz', f: 0.0295735295625 },
      { id: 'tbsp', name: '큰술',  sym: 'Tbsp', f: 0.015 },
      { id: 'tsp',  name: '작은술', sym: 'tsp', f: 0.005 }
    ]},
    { id: 'temp', label: '온도', icon: '🌡️', special: 'temp', units: [
      { id: 'c', name: '섭씨', sym: '℃', f: 1 },
      { id: 'f', name: '화씨', sym: '℉', f: 1 },
      { id: 'k', name: '켈빈', sym: 'K',  f: 1 }
    ]},
    { id: 'speed', label: '속도', icon: '🚀', special: null, units: [
      { id: 'kmh', name: '시속 킬로미터', sym: 'km/h', f: 1 },
      { id: 'ms',  name: '초속 미터',   sym: 'm/s',  f: 3.6 },
      { id: 'mph', name: '시속 마일',   sym: 'mph',  f: 1.609344 },
      { id: 'kn',  name: '노트',        sym: 'kn',   f: 1.852 },
      { id: 'mach', name: '마하',       sym: 'Ma',   f: 1225.044 }
    ]},
    { id: 'data', label: '데이터', icon: '💾', special: null, units: [
      { id: 'mb', name: '메가바이트', sym: 'MB', f: 1 },
      { id: 'b',  name: '바이트',     sym: 'B',  f: 0.00000095367431640625 },
      { id: 'kb', name: '킬로바이트', sym: 'KB', f: 0.0009765625 },
      { id: 'gb', name: '기가바이트', sym: 'GB', f: 1024 },
      { id: 'tb', name: '테라바이트', sym: 'TB', f: 1048576 },
      { id: 'bit', name: '비트',      sym: 'bit', f: 0.00000011920928955078125 }
    ]}
  ];

  var PRESETS = [
    { label: '84㎡ → 평', sub: '아파트 전용면적', cat: 'area', value: '84', from: 'm2', to: 'pyeong' },
    { label: '25평 → ㎡', sub: '평수 → 제곱미터', cat: 'area', value: '25', from: 'pyeong', to: 'm2' },
    { label: '1근 → g', sub: '시장 고기 한 근', cat: 'weight', value: '1', from: 'geun', to: 'g' },
    { label: '70kg → lb', sub: '몸무게 파운드', cat: 'weight', value: '70', from: 'kg', to: 'lb' },
    { label: '98.6℉ → ℃', sub: '체온 화씨', cat: 'temp', value: '98.6', from: 'f', to: 'c' },
    { label: '55in → cm', sub: 'TV 화면 크기', cat: 'len', value: '55', from: 'in', to: 'cm' },
    { label: '100km/h → mph', sub: '자동차 속도', cat: 'speed', value: '100', from: 'kmh', to: 'mph' },
    { label: '8GB → MB', sub: '파일·메모리 용량', cat: 'data', value: '8', from: 'gb', to: 'mb' }
  ];

  var KEY = 'unitconv:v1';
  var PRECS = [0, 1, 2, 3, 4];

  /* ---------------------------------------------------------------- 상태 */
  var state = { cat: 'len', value: '1', from: 'm', to: 'cm', prec: 2 };

  function catById(id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i];
    return CATS[0];
  }
  function unitOf(cat, id) {
    for (var i = 0; i < cat.units.length; i++) if (cat.units[i].id === id) return cat.units[i];
    return cat.units[0];
  }

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!raw || typeof raw !== 'object') return;
      if (raw.cat && catById(raw.cat).id === raw.cat) state.cat = raw.cat;
      var c = catById(state.cat);
      if (raw.from && unitOf(c, raw.from).id === raw.from) state.from = raw.from;
      if (raw.to && unitOf(c, raw.to).id === raw.to) state.to = raw.to;
      if (typeof raw.value === 'string' && /^-?\d*\.?\d*$/.test(raw.value)) state.value = raw.value;
      if (PRECS.indexOf(raw.prec) !== -1) state.prec = raw.prec;
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ---------------------------------------------------------------- 계산 */
  function round(v, p) {
    if (!isFinite(v)) return v;
    var f = Math.pow(10, p);
    return (v < 0 ? -1 : 1) * Math.floor(Math.abs(v) * f + 0.5) / f;
  }
  function fmt(v, p) {
    if (!isFinite(v)) return '–';
    var r = round(v, p);
    if (Object.is(r, -0)) r = 0;
    // 반올림하면 0이 되는 아주 작은 값은 "0" 대신 한계값으로 알려 준다
    if (r === 0 && v !== 0) return '<' + (p > 0 ? Math.pow(10, -p).toFixed(p) : '1');
    var s;
    if (Math.abs(r) >= 1e15) { s = r.toExponential(3); return s; }
    s = r.toFixed(p);
    if (p > 0 && s.indexOf('.') !== -1) s = s.replace(/0+$/, '').replace(/\.$/, '');
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return parts.join('.');
  }
  // 온도: 기준은 섭씨
  function toC(unitId, v) {
    if (unitId === 'f') return (v - 32) * 5 / 9;
    if (unitId === 'k') return v - 273.15;
    return v;
  }
  function fromC(unitId, c) {
    if (unitId === 'f') return c * 9 / 5 + 32;
    if (unitId === 'k') return c + 273.15;
    return c;
  }
  /** 값 v(단위 fromId)를 cat 의 모든 단위로 환산한 {단위id: 숫자} */
  function convert(catId, v, fromId) {
    var cat = catById(catId);
    var out = {};
    if (cat.special === 'temp') {
      var c = toC(unitOf(cat, fromId).id, v);
      for (var j = 0; j < cat.units.length; j++) out[cat.units[j].id] = fromC(cat.units[j].id, c);
      return out;
    }
    var src = unitOf(cat, fromId);
    var base = v * src.f;
    for (var i = 0; i < cat.units.length; i++) out[cat.units[i].id] = base / cat.units[i].f;
    return out;
  }

  function parseValue() {
    var raw = String(state.value).replace(/\s|,|_/g, '');
    if (raw === '' || raw === '-' || raw === '.' || raw === '-.') return { empty: true };
    if (!/^-?(\d+(\.\d*)?|\.\d+)$/.test(raw)) return { bad: true };
    var n = Number(raw);
    if (!isFinite(n)) return { bad: true };
    return { n: n };
  }

  /* ---------------------------------------------------------------- DOM */
  var $ = function (s) { return document.querySelector(s); };
  var tabsEl = $('#tabs'), fromEl = $('#fromUnit'), valueEl = $('#value');
  var listEl = $('#unitList'), heroFrom = $('#heroFrom'), heroVal = $('#heroVal');
  var errEl = $('#errMsg'), toastEl = $('#toast'), precBox = $('#precBox');

  function renderTabs() {
    tabsEl.innerHTML = CATS.map(function (c) {
      return '<button class="tab" type="button" role="tab" data-cat="' + c.id + '" aria-selected="' +
        (c.id === state.cat ? 'true' : 'false') + '"><span class="ic" aria-hidden="true">' + c.icon +
        '</span>' + c.label + '</button>';
    }).join('');
  }

  function renderPrec() {
    precBox.innerHTML = '<span class="prec-t">자릿수</span>' + PRECS.map(function (p) {
      return '<button type="button" data-prec="' + p + '" aria-pressed="' + (p === state.prec ? 'true' : 'false') +
        '" aria-label="소수 ' + p + '자리">' + (p === 0 ? '0' : p) + '</button>';
    }).join('');
  }

  function renderFrom() {
    var cat = catById(state.cat);
    fromEl.innerHTML = cat.units.map(function (u) {
      return '<option value="' + u.id + '">' + u.name + ' (' + u.sym + ')</option>';
    }).join('');
    fromEl.value = state.from;
  }

  function renderPresets() {
    $('#presets').innerHTML = PRESETS.map(function (p, i) {
      return '<button class="preset" type="button" data-preset="' + i + '">' +
        p.label.replace(' → ', ' <b>→</b> ') + '<span>' + p.sub + '</span></button>';
    }).join('');
  }

  function render() {
    renderTabs();
    renderFrom();
    renderPrec();
    if (valueEl.value !== state.value) valueEl.value = state.value;

    var cat = catById(state.cat);
    var pv = parseValue();
    var fromU = unitOf(cat, state.from);

    if (pv.empty) {
      heroFrom.textContent = '값을 입력하면 바로 환산됩니다';
      heroVal.textContent = '–';
      errEl.hidden = true;
      listEl.innerHTML = '';
      return;
    }
    if (pv.bad) {
      heroFrom.textContent = '값을 확인해 주세요';
      heroVal.textContent = '–';
      errEl.textContent = '숫자만 넣을 수 있어요. 예) 12.5';
      errEl.hidden = false;
      listEl.innerHTML = '';
      return;
    }
    errEl.hidden = true;

    var res = convert(state.cat, pv.n, fromU.id);
    var toU = unitOf(cat, state.to);

    heroFrom.textContent = fmt(pv.n, 4) + ' ' + fromU.name + ' =';
    heroVal.innerHTML = fmt(res[toU.id], state.prec) + ' <small>' + toU.sym + '</small>';

    listEl.innerHTML = cat.units.map(function (u) {
      return '<li><button class="urow' + (u.id === state.to ? ' on' : '') + '" type="button" data-unit="' + u.id +
        '" aria-label="' + u.name + ' ' + fmt(res[u.id], state.prec) + ' ' + u.sym + ' — 결과 단위로 선택">' +
        '<span class="un">' + u.name + '<i>' + u.sym + '</i></span>' +
        '<span class="uv">' + fmt(res[u.id], state.prec) + '<u>' + u.sym + '</u></span></button></li>';
    }).join('');

    save();
  }

  function setCat(id) {
    var cat = catById(id);
    state.cat = cat.id;
    state.from = cat.units[0].id;
    state.to = cat.units.length > 1 ? cat.units[1].id : cat.units[0].id;
    render();
  }

  /* ---------------------------------------------------------------- 이벤트 */
  tabsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) setCat(b.getAttribute('data-cat'));
  });

  // 좌우 화살표로 분류 이동 (role=tab)
  tabsEl.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var i = 0;
    for (var k = 0; k < CATS.length; k++) if (CATS[k].id === state.cat) i = k;
    i = (i + (e.key === 'ArrowRight' ? 1 : CATS.length - 1)) % CATS.length;
    setCat(CATS[i].id);
    var nb = tabsEl.querySelector('.tab[data-cat="' + CATS[i].id + '"]');
    if (nb) nb.focus();
    e.preventDefault();
  });

  valueEl.addEventListener('input', function () {
    state.value = this.value;
    render();
  });

  fromEl.addEventListener('change', function () {
    state.from = this.value;
    render();
  });

  $('#swapBtn').addEventListener('click', function () {
    var t = state.from;
    state.from = state.to;
    state.to = t;
    render();
    toast('단위를 바꿨어요');
  });

  precBox.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-prec]');
    if (!b) return;
    state.prec = Number(b.getAttribute('data-prec'));
    render();
  });

  listEl.addEventListener('click', function (e) {
    var b = e.target.closest('.urow');
    if (!b) return;
    state.to = b.getAttribute('data-unit');
    render();
  });

  $('#presets').addEventListener('click', function (e) {
    var b = e.target.closest('.preset');
    if (!b) return;
    var p = PRESETS[Number(b.getAttribute('data-preset'))];
    state.cat = p.cat;
    state.value = p.value;
    state.from = p.from;
    state.to = p.to;
    render();
    toast(p.label + ' 적용');
  });

  $('#resetBtn').addEventListener('click', function () {
    state = { cat: 'len', value: '1', from: 'm', to: 'cm', prec: 2 };
    try { localStorage.removeItem(KEY); } catch (e) {}
    render();
    toast('처음 상태로 되돌렸어요');
  });

  $('#copyBtn').addEventListener('click', function () {
    var cat = catById(state.cat);
    var pv = parseValue();
    if (pv.empty || pv.bad) { toast('복사할 값이 없어요'); return; }
    var res = convert(state.cat, pv.n, state.from);
    var fromU = unitOf(cat, state.from);
    var lines = [fmt(pv.n, 4) + ' ' + fromU.sym + ' 기준'];
    cat.units.forEach(function (u) {
      if (u.id === state.from) return;
      lines.push(fmt(res[u.id], state.prec) + ' ' + u.sym);
    });
    var text = lines.join('\n');
    copyText(text).then(function (ok) { toast(ok ? '결과를 복사했어요' : '복사에 실패했어요'); });
  });

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(text); });
    }
    return Promise.resolve(fallback(text));
  }
  function fallback(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text == null ? '' : text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------------------------------------------------------------- 공개 API(검증용) */
  window.UnitConv = {
    cats: function () {
      return CATS.map(function (c) { return { id: c.id, label: c.label, special: c.special,
        units: c.units.map(function (u) { return { id: u.id, sym: u.sym, f: u.f }; }) }; });
    },
    state: function () {
      return { cat: state.cat, value: state.value, from: state.from, to: state.to, prec: state.prec,
        fromLabel: document.querySelector('#fromUnit').selectedOptions[0].textContent };
    },
    convert: convert,
    fmt: fmt,
    round: round,
    presets: function () { return PRESETS.slice(); },
    setCat: setCat,
    set: function (o) {
      if (o && o.cat) { state.cat = catById(o.cat).id; }
      if (o && o.from) state.from = o.from;
      if (o && o.to) state.to = o.to;
      if (o && typeof o.value === 'string') state.value = o.value;
      render();
    }
  };

  load();
  // 저장된 단위가 현재 분류에 없으면 초기화
  var c0 = catById(state.cat);
  if (!c0.units.some(function (u) { return u.id === state.from; })) state.from = c0.units[0].id;
  if (!c0.units.some(function (u) { return u.id === state.to; })) state.to = c0.units[1].id;
  renderPresets();
  render();
})();
</script>
</body>
</html>
